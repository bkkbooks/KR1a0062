body:
  text: 嘗記兒時從家庭授易聞之先君子云昔晦庵先生之講學於雲谷也我先文簡雲莊兄弟與西山蔡先生父子遊從最久講四書之餘必及於易與諸生時時凌絶頂登眺觀天地八極之大察隂陽造化之妙蓋其胸中已有真易一部在宇宙故所論象數義理自有以見其實而造其微晦庵及雲中皆谷中書室名也舊藏雲莊所抄諸經師説數巨帙兵燼之餘其存者蓋千百之什一耳一日約無咎詹君退齋熊君訪雲谷遺迹適值新安胡君庭芳來訪出易學啓蒙通釋一編見示謂其父玉齋平生精力盡在此書亟閲諦玩見其論象説理允謂明備而其所援引則雲谷當日及門之士遺言餘論多在焉時熊君以易學授兒輩謂是誠讀者不可闕之書因言庭芳再入閩惟汲汲焉父書無傳是懼且欲以見屬仰惟一時師友遊從之盛重念先世問學淵源之舊輒為刊置書堂以寓惓惓景慕之心且以成胡君之志焉噫易之為學非潛心之深玩理之熟者未易言也學者誠能由通以悟四篇之大旨由四篇以窺四聖之全書則是編亦非小補云至元壬辰季夏劉涇楫之謹跋伏羲因河圖畫卦大禹因洛書敘疇孔安國以來有是言矣易大傳曰河出圖洛出書聖人則之且曰易有四象所以示也若然則河圖洛書皆聖人則之以作易者也及以先後天八卦方位考之與圖書之數已有自然之配合所謂易有四象者尤昭然可見矣何則洛書一居北六居西北老隂之位也故坤艮居之九居南四居東南老陽之位也故乾兊居之三居東八居東北少隂之位也故離震居之七居西二居西南少陽之位也故坎巽居之五居中則固虛之為太極也此非先天之四象乎河圖天一地六為水居北故坎亦居北地二天七為火居南故離亦居南天三地八為木居東故震亦居東地四天九為金居西故兊亦居西天五地十為土居中分旺於四季故乾坤艮巽亦居四維之位此非後天之四象乎大抵先天方位言對待之體也天上地下日東月西山鎮西北澤注東南風起西南雷動東北乾坤定位六子成列乃質之一定而不可易者也後天方位言流行之用也春而夏夏而秋秋而冬冬而復春五氣順布四時行焉乃氣之相推而不可窮者也此皆自然吻合不假安排天地之間開眼即見聖人所以則圖書以畫卦者蓋非苟焉而作也漢儒不此之察毋亦惑於書所謂天乃錫禹洪範九疇之説乎不知此亦天乃錫王勇智之類九疇大法非人所能為則亦天之所與耳古人之言九數何莫不出於洛書又豈特九疇為然哉若夫聖人作易則但當證以吾夫子之言可也每恨生晚無從質之文公徒抱此一大疑而已己丑春余讀書武夷山中有新安胡君庭芳來訪出其父書一編曰易學啓蒙通釋其窮象數也精深其析義理也明白且其間有言先後天方位暗與圖書數合者不符而同然後知天下之公理非但一人之私論也兹因刻梓告成輒述所見以識其後云壬辰仲夏望日後學武夷熊禾跋
