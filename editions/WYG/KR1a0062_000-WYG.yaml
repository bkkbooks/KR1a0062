body:
  text: 易學啟蒙通釋易類提要臣等謹案易學啟蒙通釋二卷宋胡方平撰方平字師魯號玉齋婺源人據董真卿周易㑹通載是書有方平至元己丑自序則入元已十四年矣然考熊禾䟦稱己丑春讀書武夷山中有新安胡君庭芳來訪出其父書一編曰易學啟蒙通釋又劉涇跋亦稱一日約退齋熊君訪雲谷遺蹟適新安胡君庭芳來訪出易學啟蒙通釋一編謂其父玉齋平生精力盡在此書輒為刻置書室云云則己丑乃禾與涇刋書作跋之年非方平自序之年真卿誤也方平之學出於董夢程夢程之學出於黄幹幹朱子壻也故方平及其子一桂皆篤守朱子之説此書即發明朱子易學啟蒙之旨案朱子易學啟蒙序曰近世學者類喜談易其專於爻義者既支離散漫而無所根著其涉於象數者又皆牽合附㑹而或以為出於聖人心思智慮之所為也若是者余竊病焉因與同志頗輯舊聞為書四篇以示初學使毋疑於其説云云蓋易之為道理數並存不可滯於一説朱子因程𫝊専主明理故兼取邵子之數以補其偏非脱畧易理惟著此書以言數也後人置本義不道惟假借此書以轉相推衍至於支離轇轕而不已是豈朱子之本旨乎方平此書雖亦専闡數學而根據朱子之書反覆詮釋所採諸書凡黄幹董銖劉爚陳埴蔡淵蔡沈六家皆朱子門人又蔡模徐幾翁詠三家模蔡淵子幾詠皆淵之門人故所衍説尚不至如他家之竟離其宗是亦讀啟蒙者所當考矣董真卿所稱方平自序今本佚之惟存後序一篇朱彛尊經義考乃竟以朱子原序為方平之序可謂千慮之一失徐氏通志堂刻本於此序之末題淳熈丙午暮春既望雲臺真逸手記是顯著朱子之别號矣而其標目乃稱易學啟蒙通釋序淳熙丙午下距至元己丑凡一百一十三年朱子安知有通釋乎今刋正之俾無滋後來之疑焉乾隆四十六年十一月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀易學啟蒙原序聖人觀象以畫卦揲蓍以命爻使天下後世之人皆有以決嫌疑定猶豫而不迷於吉凶悔吝之塗其功可謂盛矣然其為卦也自本而榦自榦而支其勢若有所迫而自不能己其為蓍也分合進退従横逆順亦無往而不相值焉是豈聖人心思智慮之所得為也哉特氣數之自然形於法象見於圖畫者有以啟於其心而假手焉耳近世學者類喜談易而不察乎此其專於文義者既支離散漫而無所根著其涉於象數者又皆牽合傅㑹而或以為出於聖人心思智慮之所為也若是乎予竊病焉因與同志頗輯舊聞為書四篇以示初學使毋疑於其說云淳熈丙午莫春既望雲臺真逸手記啟蒙所引姓氏孔氏安國劉氏歆字子駿闗氏朗字子明周子程子邵子歐陽子程氏逈字可久號沙隨蔡氏元定字季通號西山文公門人通釋所引姓氏黄氏榦字直卿號勉齋文公門人有語録董氏銖字叔重號盤澗文公門人有語録劉氏爚字晦伯號雲莊文公門人有經說陳氏植字器之號潜室集及語録文公門人有木鍾蔡氏淵字伯静號節齋書文公門人有易訓解及象數餘論等蔡氏沉字仲黙號九峯内篇文公門人有皇極蔡氏模號覺軒節齋子有河洛探賾徐氏㡬字子與號進齋節齋門人有輯講環中意翁氏泳字永叔號思齋節齋門人有口義
